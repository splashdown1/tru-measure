<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16140f">
<title>TRU MEASURE</title>
<style>
:root{--bg:#16140f;--ink:#f3ead8;--dim:#b7a98e;--line:#3a3224;--gold:#e0b15a;--card:#221c14}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input,select{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--gold)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap} input,select{background:#100e0a;border:1px solid var(--line);border-radius:8px;padding:10px}
#n{width:110px} select{flex:1} button{background:var(--gold);color:#1a140c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--gold);font-size:12px;letter-spacing:.12em} .big{font-size:26px;margin:4px 0} .src{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><h1>TRU <span>MEASURE</span></h1><p class="sub">Arithmetic only. Exact factors. No estimates dressed up as law.</p></header>
<div class="bar">
  <input id="n" inputmode="decimal" value="1">
  <select id="u"></select>
  <button id="send">Send</button>
</div>
<main id="out"></main>
<script>
const U=[
["inch","mm",25.4],["foot","m",0.3048],["yard","m",0.9144],["mile","km",1.609344],
["mm","inch",1/25.4],["m","foot",1/0.3048],["km","mile",1/1.609344],
["ounce","g",28.349523125],["pound","kg",0.45359237],["g","ounce",1/28.349523125],["kg","pound",1/0.45359237],
["floz","ml",29.5735295625],["cup","ml",236.5882365],["pint","ml",473.176473],["quart","ml",946.352946],["gallon","l",3.785411784],
["tsp","ml",4.92892159375],["tbsp","ml",14.78676478125],
["C to F","F",null],["F to C","C",null]
];
const FACT=[
["cup","16 tablespoons, 48 teaspoons"],
["tablespoon","3 teaspoons"],
["pint","2 cups"],
["quart","2 pints, 4 cups"],
["gallon","4 quarts"],
["pound","16 ounces avoirdupois"],
["foot","12 inches"],
["yard","3 feet"],
["mile","5,280 feet"],
["day","24 hours, 1,440 minutes"]
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(k,t,d){return `<article class="card"><div class="k">${k}</div><div class="big">${esc(t)}</div><div>${esc(d)}</div><div class="src">Exact factor. US customary liquid, not Imperial.</div></article>`;}
function run(){
  const n=parseFloat(document.getElementById("n").value);
  const u=document.getElementById("u").value;
  if(isNaN(n)){document.getElementById("out").innerHTML=card("GAP","Need a number","Type a number, then pick a unit.");return;}
  if(u==="C to F"){document.getElementById("out").innerHTML=card("TEMP",n+" °C",(n*9/5+32).toFixed(2)+" °F. Water freezes at 0 and boils at 100 at sea level.");return;}
  if(u==="F to C"){document.getElementById("out").innerHTML=card("TEMP",n+" °F",((n-32)*5/9).toFixed(2)+" °C.");return;}
  const row=U.find(x=>x[0]===u);
  const out=n*row[2];
  const shown=Math.abs(out)>=100?out.toFixed(2):out.toPrecision(6);
  document.getElementById("out").innerHTML=card("CONVERT",n+" "+u,shown+" "+row[1])+FACT.map(f=>card("TABLE",f[0],f[1])).join("");
}
document.getElementById("u").innerHTML=U.map(x=>`<option>${x[0]}</option>`).join("");
document.getElementById("send").onclick=run;
document.getElementById("n").onkeydown=e=>{if(e.key==="Enter") run();};
run();
</script>
</body>
</html>
